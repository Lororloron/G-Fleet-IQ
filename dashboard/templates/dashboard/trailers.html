{% extends "dashboard/base.html" %}

{% block content %}

<h1 class="mb-4">🚚 Trailers</h1>
<div class="mb-3">
    <a href="{% url 'add_trailer' %}" class="btn btn-primary">
        ➕ Add Trailer
    </a>
</div>

<div class="card mb-4">
    <div class="card-body">

        <h3>Trailers</h3>

        <p class="text-muted">
            Trailer management is coming next.
        </p>

    </div>
</div>

<table class="table table-striped">

    <thead>
        <tr>
            <th>ID</th>
            <th>Trailer</th>
        </tr>
    </thead>

    <tbody>

    {% for trailer in trailers %}

    <tr>
    <td>{{ trailer.id }}</td>
    <td>{{ trailer }}</td>
    <td>
        <a href="{% url 'edit_trailer' trailer.id %}" class="btn btn-warning btn-sm">
            ✏️ Edit
        </a>
    </td>
</tr>

    {% empty %}

    <tr>
        <td colspan="2" class="text-center">
            No trailers found.
        </td>
    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
