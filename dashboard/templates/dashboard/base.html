<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>G Fleet IQ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            🚚 G Fleet IQ
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="{% url 'home' %}">
                    🏠 Dashboard
                </a>

                <a class="nav-link" href="{% url 'companies' %}">
                    🏢 Companies
                </a>

                <a class="nav-link" href="{% url 'customers' %}">
                    👥 Customers
                </a>

                <a class="nav-link" href="{% url 'drivers' %}">
                    👤 Drivers
                </a>

                <a class="nav-link" href="{% url 'trucks' %}">
                    🚛 Trucks
                </a>

                <a class="nav-link" href="{% url 'trailers' %}">
                    🚚 Trailers
                </a>

                <a class="nav-link" href="{% url 'loads' %}">
                    📦 Loads
                </a>

                <a class="nav-link" href="{% url 'dispatch_board' %}">
                    📋 Dispatch Board
                </a>

                <a class="nav-link" href="{% url 'ai_dispatch' %}">
                    🤖 AI Dispatch
                </a>

                <a class="nav-link" href="{% url 'fleet_map' %}">
                    🗺️ Fleet Map
                </a>

            </div>

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<footer class="text-center text-muted mt-5 mb-3">
    © 2026 G Fleet IQ | AI Dispatch Platform
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
