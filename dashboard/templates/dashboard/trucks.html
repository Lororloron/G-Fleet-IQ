{% extends "dashboard/base.html" %}

{% block content %}

<h1 class="mb-4">🚛 Trucks</h1>
<div class="mb-3">
    <a href="{% url 'add_truck' %}" class="btn btn-primary">
        ➕ Add Truck
    </a>
</div>
<div class="mb-3">
    <a href="{% url 'add_truck' %}" class="btn btn-primary">
        ➕ Add Truck
    </a>
</div>

<table class="table table-striped">

    <thead>
        <tr>
            <th>Unit Number</th>
            <th>Capacity</th>
            <th>Active</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

    {% for truck in trucks %}

    <tr>
    <td>{{ truck.unit_number }}</td>
    <td>{{ truck.capacity }}</td>
    <td>{{ truck.active }}</td>

    <td>

        <a href="{% url 'edit_truck' truck.id %}"
           class="btn btn-warning btn-sm">
            ✏️ Edit
        </a>

        <a href="{% url 'delete_truck' truck.id %}"
           class="btn btn-danger btn-sm">
            🗑️ Delete
        </a>

    </td>
</tr>

    <tr>
        <td colspan="4">No trucks found.</td>
    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
<a href="{% url 'edit_truck' truck.id %}" class="btn btn-warning btn-sm">
    ✏️ Edit
</a>

<a href="{% url 'delete_truck' truck.id %}" class="btn btn-danger btn-sm">
    🗑️ Delete
</a>
