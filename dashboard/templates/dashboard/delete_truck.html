{% extends "dashboard/base.html" %}

{% block content %}

<h1>🗑️ Delete Truck</h1>

<p>Delete truck <strong>{{ truck }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a href="{% url 'trucks' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
