{% extends "dashboard/base.html" %}

{% block content %}

<h1 class="mb-4">➕ Add Driver</h1>

<div class="card shadow">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                💾 Save Driver
            </button>

            <a href="{% url 'drivers' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
