<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers - G Fleet IQ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1>🚛 Drivers</h1>

    <a href="/" class="btn btn-primary mb-3">
        ← Back to Dashboard
    </a>

    <table class="table table-striped table-bordered">

        <thead>

           <tr>
    <th>Name</th>
    <th>Location</th>
    <th>Available</th>
    <th>Truck</th>
    <th>Actions</th>
</tr>

        </thead>

        <tbody>

        {% for driver in drivers %}

            <tr>

    <td>{{ driver.name }}</td>
    <td>{{ driver.location }}</td>
    <td>{{ driver.available }}</td>
    <td>{{ driver.truck|default:"Not Assigned" }}</td>

    <td>
        <a href="{% url 'edit_driver' driver.id %}" class="btn btn-warning btn-sm">
    ✏️ Edit
</a>
    </td>

</tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
